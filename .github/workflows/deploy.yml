name: test-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 단위·데이터·사이트 점검
        run: npm test
      - name: 생성 페이지가 최신인지 확인
        run: npm run build && git diff --exit-code
      - name: 브라우저 E2E (로컬 서버)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: 배포 파일 구성
        run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 배포 반영 대기
        run: |
          sha=$(git rev-parse --short HEAD)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://rolex0331-cloud.github.io/yeonchagak/)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "status $code"
      - name: 배포 사이트 E2E
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: https://rolex0331-cloud.github.io/yeonchagak/
